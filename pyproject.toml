[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soap-reset-time-flask"
version = "1.0.0"
description = "Parse SOAP OAM logs for RU reset/carrier timings and show them in a Flask dashboard"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Amize Zhou" }]
dependencies = [
  "flask>=2.2",
  "pymysql>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
soap-reset-time = "soap_parser.cli:main"
reset-time-flask = "web.app:main"
reset-time-import = "importer.cli:main"

[tool.setuptools.packages.find]
include = ["soap_parser*", "importer*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
